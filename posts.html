<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Posts - Sirat (analyz3r)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: transparent;
      color: #f5f5f5;
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
    }

    header, main, footer {
      text-align: center;
      padding: 20px;
    }

    header h1 {
      color: #00ff99;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: #ccc;
      margin: 0 15px;
      text-decoration: none;
    }

    nav a:hover {
      color: #00ff99;
    }

    section {
      margin: 40px auto;
      max-width: 800px;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 30px;
      border-radius: 10px;
    }

    h2 {
      color: #00ff99;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin: 15px 0;
      font-size: 1.1em;
    }

    li a {
      color: #ffffff;
      text-decoration: none;
    }

    li a:hover {
      text-decoration: underline;
    }

    footer {
      color: #888;
      font-size: 0.9em;
      margin-top: 50px;
    }

    /* Black outline around all text */
    * {
      text-shadow: 0 0 3px black, 0 0 5px black, 1px 1px 2px black;
    }
  </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<header>
  <h1>Sirat (analyz3r)</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="#posts">Posts</a>
  </nav>
</header>

<main>
  <section id="posts">
    <h2>All Posts</h2>
    <ul>
      <li><a href="#">The Levels of Hacking, Beginner vs PRO!</a></li>
      <img src="https://siratsami.github.io/images/cgpt-levelsofhacking.png" width="400" height="300">
    </ul>
  </section>
</main>

<footer>
  &copy; 2025 Sirat (analyz3r)
</footer>

<script>
  const canvas = document.getElementById("matrixCanvas");
  const ctx = canvas.getContext("2d");

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  const letters = "アァイィウエェオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const fontSize = 14;
  const columns = Math.floor(width / fontSize);
  const drops = Array(columns).fill(1);

  function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 5, 0.15)";
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = "#00ff99";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < columns; i++) {
      const char = letters.charAt(Math.floor(Math.random() * letters.length));
      ctx.fillText(char, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(drawMatrix, 33);

  window.addEventListener("resize", () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });
</script>

</body>
</html>
