<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Open New Tab</title>
  <script>
    // Wait for 1 second, then open a new tab
    setTimeout(function() {
      window.open('https://example.com', '_blank');  // Replace with the URL you want to open
    }, 1000);  // 1000 milliseconds = 1 second
  </script>
</head>
<body>
  <h1>This page will automatically open a new tab in 1 second.</h1>
</body>
</html>
