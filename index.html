<!DOCTYPE html>
<html>
<head>
  <title>iOS-Compatible Image Stress Test</title>
</head>
<body>
  <h1>Loading images (iOS-compatible)...</h1>
  <p id="status">Loading 0/50 images</p>

  <script>
    const imageUrl = 'https://one.one.one.one/media/card.png';
    const totalImages = 5000;
    const batchSize = 10;
    const delayBetweenBatches = 10; // 1 second

    let loadedCount = 0;

    function loadImage(i) {
      const cacheBuster = Math.random().toString(36).substring(2);
      const img = document.createElement('img');
      img.src = `${imageUrl}?cb=${cacheBuster}`;
      img.width = 1;
      img.height = 1;
      img.style.visibility = 'hidden'; // visible to browser, invisible to user

      img.onload = () => {
        loadedCount++;
        document.getElementById('status').textContent = `Loading ${loadedCount}/${totalImages} images`;
        console.log(`Image ${i + 1} loaded`);
      };

      img.onerror = () => {
        console.warn(`Image ${i + 1} failed to load`);
      };

      document.body.appendChild(img);
    }

    function loadImagesInBatches() {
      let index = 0;

      function loadBatch() {
        for (let j = 0; j < batchSize && index < totalImages; j++, index++) {
          loadImage(index);
        }

        if (index < totalImages) {
          setTimeout(loadBatch, delayBetweenBatches);
        }
      }

      loadBatch();
    }

    loadImagesInBatches();
  </script>
</body>
</html>
