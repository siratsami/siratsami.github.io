<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEAT MOOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(139, 0, 0, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(139, 0, 0, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.9) 0%, #0a0a0a 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Realistic blood splatters */
        .blood-splatter {
            position: fixed;
            pointer-events: none;
            z-index: 1;
        }

        .splatter1 {
            top: 8%;
            right: 15%;
            width: 280px;
            height: 280px;
            background: 
                radial-gradient(circle at 30% 40%, #a00 0%, #800 30%, transparent 60%),
                radial-gradient(circle at 60% 20%, #900 0%, transparent 50%),
                radial-gradient(circle at 50% 70%, #700 0%, transparent 40%);
            filter: blur(1px);
            opacity: 0.6;
        }

        .splatter1::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #a00 0%, #700 50%, transparent 70%);
            border-radius: 45% 55% 60% 40%;
            transform: translate(-50%, -50%) rotate(25deg);
        }

        .splatter1::after {
            content: '';
            position: absolute;
            top: 30%;
            right: 20%;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #900 0%, transparent 70%);
            border-radius: 50%;
        }

        .splatter2 {
            bottom: 10%;
            left: 8%;
            width: 350px;
            height: 250px;
        }

        .splatter2::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(ellipse, #900 0%, #600 40%, transparent 65%);
            border-radius: 40% 60% 55% 45%;
            filter: blur(2px);
            opacity: 0.7;
        }

        .splatter2::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 100px;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #a00 0%, #700 50%, transparent 70%);
            border-radius: 60% 40% 50% 50%;
            filter: blur(1px);
            opacity: 0.6;
        }

        .splatter3 {
            top: 50%;
            left: 5%;
            width: 200px;
            height: 400px;
        }

        .drip {
            position: absolute;
            background: linear-gradient(180deg, #8b0000 0%, #660000 40%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0.5;
        }

        .drip1 { top: 0; left: 10px; width: 4px; height: 120px; }
        .drip2 { top: 20px; left: 40px; width: 3px; height: 90px; animation: drip-fall 4s ease-in-out infinite; }
        .drip3 { top: 10px; left: 70px; width: 5px; height: 150px; }
        .drip4 { top: 30px; left: 100px; width: 3px; height: 80px; animation: drip-fall 5s ease-in-out infinite 1s; }
        .drip5 { top: 0px; left: 130px; width: 4px; height: 110px; }

        @keyframes drip-fall {
            0%, 100% { transform: scaleY(1); opacity: 0.5; }
            50% { transform: scaleY(1.3); opacity: 0.7; }
        }

        /* Small blood drops */
        .blood-drop {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #a00 0%, #600 60%, transparent 100%);
            border-radius: 50%;
            opacity: 0.6;
        }

        .drop1 { top: 15%; right: 25%; width: 6px; height: 6px; }
        .drop2 { top: 22%; right: 18%; width: 10px; height: 10px; }
        .drop3 { bottom: 25%; left: 18%; width: 7px; height: 7px; }
        .drop4 { top: 60%; right: 30%; width: 9px; height: 9px; }
        .drop5 { bottom: 35%; left: 25%; width: 5px; height: 5px; }

        /* Additional splatter marks */
        .splatter-mark {
            position: fixed;
            pointer-events: none;
            z-index: 1;
        }

        .mark1 {
            top: 20%;
            right: 8%;
            width: 60px;
            height: 30px;
            background: radial-gradient(ellipse, #900 0%, transparent 70%);
            border-radius: 40% 60% 70% 30%;
            opacity: 0.4;
            transform: rotate(-15deg);
        }

        .mark2 {
            bottom: 30%;
            left: 15%;
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #800 0%, transparent 65%);
            border-radius: 55% 45% 60% 40%;
            opacity: 0.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
            animation: fadeInDown 1s ease;
            position: relative;
        }

        h1 {
            font-size: 6rem;
            font-weight: 700;
            color: #8b0000;
            text-shadow: 
                3px 3px 0 #000,
                5px 5px 10px rgba(139, 0, 0, 0.8),
                0 0 30px rgba(139, 0, 0, 0.5);
            margin-bottom: 10px;
            letter-spacing: 12px;
            font-family: 'Impact', sans-serif;
            transform: rotate(-1deg);
        }

        .tagline {
            font-size: 1.5rem;
            color: #999;
            font-style: italic;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 3px;
        }

        .featured-section {
            background: rgba(20, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 50px;
            border: 3px solid rgba(139, 0, 0, 0.5);
            box-shadow: 
                inset 0 0 40px rgba(139, 0, 0, 0.2),
                0 20px 60px rgba(0, 0, 0, 0.9);
            position: relative;
            animation: fadeInUp 1s ease;
        }

        .featured-section::before {
            content: '';
            position: absolute;
            top: -15px;
            right: 15%;
            width: 60px;
            height: 60px;
            background: 
                radial-gradient(circle at 40% 30%, #a00 0%, #700 50%, transparent 70%),
                radial-gradient(circle at 70% 60%, #900 0%, transparent 60%);
            border-radius: 60% 40% 45% 55%;
            opacity: 0.6;
            filter: blur(1px);
        }

        .featured-section::after {
            content: '';
            position: absolute;
            top: -8px;
            right: 25%;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #a00 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.5;
        }

        .section-title {
            font-size: 2.8rem;
            margin-bottom: 40px;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 6px;
            position: relative;
            padding-bottom: 20px;
            text-shadow: 
                2px 2px 0 #000,
                0 0 20px rgba(255, 0, 0, 0.6);
            font-family: 'Impact', sans-serif;
            text-align: center;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #8b0000, transparent);
            border-radius: 2px;
        }

        .featured-item {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 40px;
            align-items: center;
            padding: 30px;
            background: rgba(40, 0, 0, 0.5);
            border-radius: 20px;
            border: 2px solid rgba(139, 0, 0, 0.3);
            position: relative;
            transition: all 0.4s ease;
        }

        .featured-item:hover {
            background: rgba(50, 0, 0, 0.7);
            border-color: rgba(139, 0, 0, 0.6);
            box-shadow: 0 10px 40px rgba(139, 0, 0, 0.4);
            transform: scale(1.02);
        }

        .item-image {
            width: 100%;
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid rgba(139, 0, 0, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .item-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.3) 0%, transparent 50%);
            pointer-events: none;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7) contrast(1.3) saturate(1.4);
            transition: all 0.4s ease;
        }

        .featured-item:hover .item-image img {
            filter: brightness(0.9) contrast(1.4) saturate(1.6);
            transform: scale(1.08);
        }

        .item-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .item-name {
            font-size: 3rem;
            font-weight: 700;
            color: #ff3333;
            text-shadow: 
                2px 2px 0 #000,
                0 0 15px rgba(255, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .special-badge {
            display: inline-block;
            background: linear-gradient(135deg, #8b0000, #660000);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.6);
            border: 2px solid rgba(255, 0, 0, 0.3);
            margin-top: 10px;
        }

        .item-description {
            font-size: 1.3rem;
            color: #ccc;
            line-height: 1.8;
            text-shadow: 1px 1px 2px #000;
        }

        .item-price {
            font-size: 3rem;
            font-weight: 700;
            color: #8b0000;
            text-shadow: 
                0 0 15px rgba(139, 0, 0, 0.7),
                2px 2px 0 #000;
            margin-top: 20px;
        }

        .skull-icon {
            display: inline-block;
            margin-right: 15px;
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px rgba(139, 0, 0, 0.8));
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 968px) {
            h1 {
                font-size: 4rem;
                letter-spacing: 6px;
            }

            .featured-item {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .item-image {
                height: 300px;
            }

            .item-name {
                font-size: 2.2rem;
            }

            .featured-section {
                padding: 30px;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }

            .section-title {
                font-size: 2rem;
            }

            .item-name {
                font-size: 1.8rem;
            }

            .item-description {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Realistic blood splatters -->
    <div class="blood-splatter splatter1"></div>
    <div class="blood-splatter splatter2"></div>
    <div class="blood-splatter splatter3">
        <div class="drip drip1"></div>
        <div class="drip drip2"></div>
        <div class="drip drip3"></div>
        <div class="drip drip4"></div>
        <div class="drip drip5"></div>
    </div>
    
    <!-- Blood drops -->
    <div class="blood-drop drop1"></div>
    <div class="blood-drop drop2"></div>
    <div class="blood-drop drop3"></div>
    <div class="blood-drop drop4"></div>
    <div class="blood-drop drop5"></div>
    
    <!-- Splatter marks -->
    <div class="splatter-mark mark1"></div>
    <div class="splatter-mark mark2"></div>
    
    <div class="container">
        <header>
            <h1>MEAT MOOT</h1>
            <p class="tagline">بژی کورد. (HACKED BY NULL)</p>
        </header>

        <div class="featured-section">
            <h2 class="section-title"><span class="skull-icon">☠</span>قۆندەرەی ئامادە کراو.</h2>
            
            <div class="featured-item">
                <div class="item-image">
                    <img src="https://joeyl.com/uploads/onset/PKK-Kurdistan-Workers-Party-Group-Makhmour-Iraq-Guerrilla_Fighters_of_Kurdistan_Joey_L_Photographer_009.jpg" alt="Bloody Steak">
                </div>
                
                <div class="item-content">
                    <div>
                        <div class="item-name">تاکە خواردن بەردەستە</div>
                        <div class="special-badge">قۆندەرەکانی شەڕڤانانی کوردە.</div>
                    </div>
                    
                    <p class="item-description">
                        قۆندەرەیەکی تامدار و بۆندار پڕ بە دەوی ئەو عەرەبانایە کە کوردیان پێ کمە وە پڕ بە دەوی ئەو کوردانایە پشتگیری لە تیرۆر دەکەن.
                    </p>
                    
                    <div class="item-price">$9999999999</div>
                </div>
            </div>
            <center>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgUwMtTu4499W8q4Wj0MowBdZfYHvf09TaGg&s">
        </center>
        </div>
    </div>
</body>
</html>
