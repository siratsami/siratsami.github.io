<!DOCTYPE html>
<html>
<head>
  <title>100 Simultaneous Image Loads</title>
</head>
<body>
  <h1>Loading 100 images...</h1>
  <p id="status">Loading 0/100 images</p>

  <script>
    const imageUrl = 'https://siratsami.github.io/bloated.png';
    const totalImages = 100;
    let loadedCount = 0;

    function loadImage(i) {
      const cacheBuster = Math.random().toString(36).substring(2) + Date.now();
      const img = document.createElement('img');
      img.src = `${imageUrl}?cb=${cacheBuster}&index=${i}`;
      img.width = 1;
      img.height = 1;
      img.style.visibility = 'hidden'; // avoid display:none so Safari still loads it

      img.onload = () => {
        loadedCount++;
        document.getElementById('status').textContent = `Loading ${loadedCount}/${totalImages} images`;
        console.log(`Image ${i + 1} loaded`);
      };

      img.onerror = () => {
        console.warn(`Image ${i + 1} failed to load`);
      };

      document.body.appendChild(img);
    }

    // Fire 100 requests instantly
    for (let i = 0; i < totalImages; i++) {
      loadImage(i);
    }
  </script>
</body>
</html>
