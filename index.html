<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Load 100 Images Without Preview</title>
  <style>
    /* Make images invisible initially (they won't be previewed) */
    img {
      display: none;
    }
    #log {
      white-space: pre-wrap;
      font-family: monospace;
      background-color: #f4f4f4;
      padding: 10px;
      border: 1px solid #ccc;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>Loading Images...</h1>
  <div id="log"></div> <!-- This will display the logs -->

  <script>
    const baseUrl = 'https://one.one.one.one/media/card.png';
    const imagesPerBatch = 25; // Load 25 new images per batch
    const maxImages = 500; // Limit the total images to 100
    let loadedImages = 0; // Track number of successfully loaded images
    let totalImagesLoaded = 0; // Track total images loaded
    const container = document.createElement('div'); // Create a container to hold the images
    document.body.appendChild(container);

    const logElement = document.getElementById('log'); // Element to display logs

    // Function to log messages to the HTML page
    function logMessage(message) {
      const logEntry = document.createElement('div');
      logEntry.textContent = message;
      logElement.appendChild(logEntry);
      logElement.scrollTop = logElement.scrollHeight; // Auto-scroll to bottom
    }

    // Function to load a batch of images
    function loadImages() {
      if (totalImagesLoaded >= maxImages) {
        // Stop loading if the maximum image count is reached
        logMessage(`Max images loaded: ${maxImages}`);
        return;
      }

      let batchLoaded = 0; // Track images loaded in this batch
      const images = []; // Array to hold image elements for this batch

      // Create and load images in the batch
      for (let i = 0; i < imagesPerBatch; i++) {
        const img = new Image();
        const cacheBuster = `${Date.now()}-${Math.random().toString(36).substring(2, 6)}`; // Random parameter for cache busting
        img.src = `${baseUrl}?cb=${cacheBuster}`; // Add random parameter to avoid cache

        img.onload = () => {
          batchLoaded++; // Increment batch load count
          loadedImages++; // Increment total loaded images count
          totalImagesLoaded++;

          // Log successful image load
          logMessage(`Image ${totalImagesLoaded} loaded: ${img.src}`);

          // If 25 images have loaded, check if we need to load more
          if (loadedImages >= 10) {
            logMessage(`25 images loaded. Total loaded: ${totalImagesLoaded}`);
            loadImages(); // Start loading the next batch of images
            loadedImages = 0; // Reset the counter for the next batch
          }
        };

        img.onerror = (error) => {
          // Log image loading error, but don't stop the script
          logMessage(`Error loading image: ${img.src}`);

          batchLoaded++; // Count error images to avoid blocking

          // If all images in the batch have attempted to load, move to the next batch
          if (batchLoaded === imagesPerBatch) {
            if (loadedImages >= 10) {
              loadImages(); // Load next batch after 25 images are loaded
              loadedImages = 0;
            }
          }
        };

        images.push(img); // Store the image element for batch tracking
      }

      // Append all images to the DOM
      images.forEach(img => container.appendChild(img));
    }

    loadImages(); // Start loading the initial batch of 25 images

    // Function to refresh the page every 15 seconds and log total images loaded
    setTimeout(() => {
      logMessage(`Refreshing the page after loading ${totalImagesLoaded} images...`);
      location.reload(); // Refresh the page
    }, 15000); // Refresh after 15 seconds (15000 milliseconds)
  </script>
</body>
</html>
