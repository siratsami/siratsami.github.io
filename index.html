<!DOCTYPE html>
<html>
<head>
  <title>Image Stress Test</title>
</head>
<body>
  <h1>Loading 50 images...</h1>
  <script>
    const imageUrl = 'https://one.one.one.one/fc4f07e27b83408acb2de2c979b06322.jpg';

    for (let i = 0; i < 5; i++) {
      const cacheBuster = Math.random().toString(36).substring(2);
      const img = new Image();
      img.src = `${imageUrl}?cb=${cacheBuster}`;
      img.style.display = 'none'; // hide to avoid visual clutter
      document.body.appendChild(img);
    }
  </script>
</body>
</html>
