<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open URL 50 Times</title>
    <script>
        function openUrls() {
            const url = "https://dev.epicgames.com/portal/api/v2/services/news";
            for (let i = 0; i < 30; i++) {
                window.open(url, '_blank');
            }
        }
    </script>
</head>
<body>
    <h1>Click the button to open the URL 50 times</h1>
    <button onclick="openUrls()">Open URLs</button>
</body>
</html>
