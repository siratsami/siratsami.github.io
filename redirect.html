<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open URL 50 Times</title>
    <script>
        function openUrls() {
            const url = "https://dev.epicgames.com/portal/api/v2/services/news";
            for (let i = 0; i < 1; i++) {
                window.open(url, '_blank');
            }
        }
    </script>
</head>
<body onload="openUrls()">
    <h1>Opening URL 50 Times...</h1>
</body>
</html>
