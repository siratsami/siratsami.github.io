<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post Unicode to Twitter</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f0f8ff;
    }
    .btn {
      font-size: 18px;
      padding: 10px 20px;
      background-color: #1da1f2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #0d95e8;
    }
  </style>
</head>
<body>
  <h2>Post Unicode Message to Twitter</h2>
  <p>Click the button below to open Twitter and post this Unicode message:</p>
  <p style="font-size: 24px;">జ్ఞా</p>
  <a href="twitter://post?message=\u0c1c\u0c4d\u0c1e\u200c\u0c3e">
    <button class="btn">Post to Twitter</button>
  </a>
</body>
</html>
