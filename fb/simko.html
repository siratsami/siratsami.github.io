<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Page Title</title>

    <!-- Facebook Open Graph Meta Tags -->
    <meta property="og:url" content="https://www.yourwebsite.com/page.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="The Title You Want Displayed on Facebook">
    <meta property="og:description" content="A brief, engaging summary of your webpage that appears beneath the title.">
    <meta property="og:image" content="https://www.yourwebsite.com/images/preview-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
</head>
<body>
    <h1>Welcome to my webpage</h1>
    <p>This is the visible content of the page.</p>
</body>
</html>
